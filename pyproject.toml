[project]
name = "objectapp"
version = "0.1.0"
description = "A local, file-based object workspace with an object-based UI"
authors = [
    { name = "Gene Hively", email = "ghively@cpicardgroup.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "mcp>=2.3,<3",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pywebview>=6.2.1",
    "ruamel-yaml>=0.19.1",
    "send2trash==2.1.0",
    "sse-starlette>=3.5.0",
    "tzdata==2026.5",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
objectapp = "objectapp.__main__:main"
objectapp-mcp = "objectapp.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-root = "backend"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
